name: Build and push image

on:
  schedule:
    - cron: '0 0 1 * *'  # monthly, 1st of month midnight UTC
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Push the latest tag"
        type: boolean
        default: true
      force_version_tags:
        description: "Force overwrite semver version tags (e.g. 1.0.0, 1.0, 1)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version in package.json: $VERSION" >&2
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if this version is already on Docker Hub
        id: published
        run: |
          if docker manifest inspect "${{ secrets.DOCKERHUB_USERNAME }}/spiffo:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/spiffo
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.published.outputs.exists == 'false' || inputs.force_version_tags == 'true' }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.published.outputs.exists == 'false' || inputs.force_version_tags == 'true' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.published.outputs.exists == 'false' || inputs.force_version_tags == 'true' }}
            type=sha
          flavor: |
            latest=${{ github.event_name != 'workflow_dispatch' || inputs.push_latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
